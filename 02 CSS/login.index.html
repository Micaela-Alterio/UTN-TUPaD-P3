<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <title>Veggie Food Store - Login</title>
</head>
<body>
    <div class="container">
        <form class="login-form">
            <div class="logo">
                <img src="Assets/Logo 2 header t.png"
                alt="Logo Veggie Food Store" width="200px">
            </div>
            <h1>Veggie Food Store</h1>
            <h2>Iniciar Sesión</h2>
            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="tucorreo@ejemplo.com"
                required>
            <label for="password">Contraseña</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="mínimo 8 caracteres"
                required>
            <button type="submit">Ingresar</button>
            <p class="registro">¿No tenés cuenta? <a href="#">Registrate acá</a></p>
        </form>
    </div>
</body>
</html>
