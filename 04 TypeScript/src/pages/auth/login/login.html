<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/src/style.css">
    <title>Veggie Food Store - Login</title>
</head>

<body>
    <div class="container">
    <form class="login-form" id="form-login">
            <div class="logo">
                <img src="/assets/logo.png" alt="Logo Veggie Food Store" width="200px">
            </div>
            <h1>Veggie Food Store</h1>
            <h2>Iniciar Sesión</h2>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="off" placeholder="example@example.com">
        
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="off" placeholder="********">
        
            <label for="rol">Rol</label>
            <select name="rol" id="rol">
                <option value="">Seleccione un rol</option>
                <option value="client">Cliente</option>
                <option value="admin">Admin</option>
            </select>

        <button type="submit">Ingresar</button>
        <p class="registro">¿No estás registrado?
                <a href="../registro/registro.html">Registrate acá</a></p>

    </form>
    </div>
    <script type="module" src="./login.ts"></script>
</body>

</html>
