<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/src/style.css">
    <title>Veggie Food Store - Registro</title>
</head>

<body>
    <div class ="container">
        <form class="login-form" id="form-registro">
            <div class="logo">
                <img src="/assets/logo.png"
                alt="Logo Veggie Food Store" width="200px">
            </div>
            <h1>Veggie Food Store</h1>
            <h2>Crear cuenta</h2>

            <label for="registroEmail">Email</label>
            <input
                type="email"
                id="registroEmail"
                name="email"
                placeholder="example@example.com"
                required>
            <br>
            <label for="registroPassword">Contraseña</label>
            <input
                type="password"
                id="registroPassword"
                name="password"
                placeholder="********"
                required>
            <button type="submit">Registrarse</button>
            <p class="registro">¿Ya estás registrado?
                <a href="../login/login.html">Inicia sesión acá</a></p>    
        </form>
    </div>
    <script type="module" src="./registro.ts"></script>
</body>

</html>
